name: Build Switch 2 homebrew

on:
  push:
    # version tags (v*) are built by release.yml
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Read-only by default; only the .nro job may write (it publishes the nightly pre-release).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # ounce-devkit: the commit whose install.sh is used, and the devkit version it installs
  OUNCE_DEVKIT_COMMIT: f3478152dc553a104dd991efca4bde0c6e7cfe3e
  OUNCE_DEVKIT_VERSION: "20261114"

jobs:
  test:
    name: App tests (on Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p nhse-switch --release

  nro:
    name: nhse.nro (Switch 2)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container: devkitpro/devkita64:20260219
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates build-essential

      - name: Install ounce-devkit
        run: |
          curl -fsSL -o /tmp/install.sh \
            "https://raw.githubusercontent.com/ouncebrew/ounce-devkit/${OUNCE_DEVKIT_COMMIT}/install.sh"
          sh /tmp/install.sh "${OUNCE_DEVKIT_VERSION}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src

      - name: Build nhse.nro
        run: make -C switch -j"$(nproc)"

      - uses: actions/upload-artifact@v4
        with:
          name: NHSE-Switch2
          path: switch/nhse.nro
          if-no-files-found: error

      - name: Publish rolling pre-release
        if: github.event_name == 'push' && github.ref_name == 'master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-switch2
          name: NHSE for Switch 2 — latest build from ${{ github.ref_name }}
          prerelease: true
          make_latest: false
          body: |
            Automated build of `${{ github.sha }}` from `${{ github.ref_name }}`.

            **Install:** copy `nhse.nro` to `/switch/` on the SD card and open it from the
            homebrew menu. See `switch/README.md`.
          files: switch/nhse.nro
